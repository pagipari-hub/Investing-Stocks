name: Quant Swing Trade Screener

on:
  schedule:
    # 04:30 UTC = 10:00 AM IST every Saturday
    - cron: '30 4 * * 6'
  workflow_dispatch: # Allows manual run trigger anytime via GitHub UI

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests

      - name: Run Quant Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python quant_screener.py

      - name: Store Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quant-screener-results
          path: output/quant_screener_results.csv
