name: Quant Swing Trade Screener V2

on:
  schedule:
    # Runs every Saturday at 10:00 AM IST (04:30 AM UTC)
    - cron: '30 4 * * 6'
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests

      - name: Run Quant Screener V2
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python quant_screener_v2.py

      - name: Upload Output CSV Artifact
        uses: actions/upload-artifact@v3
        with:
          name: quant-screener-v2-results
          path: output/quant_screener_results.csv
